<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Faz a página se ajustar à largura da tela (celular, tablet, computador) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>

  <!-- Estilos da página (cores, fontes e layout) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ponto de montagem: o React desenha toda a página dentro desta div -->
  <div id="root"></div>

  <!-- Código da página. O "defer" faz o script rodar só depois do HTML carregar -->
  <script src="script.js" defer></script>

  <!-- Metadado deixado pela ferramenta que exportou a página; não afeta nada -->
  <script type="application/json" data-clippy-inline-media-manifest="1">{"version":1,"slots":[]}</script>
</body>
</html>
